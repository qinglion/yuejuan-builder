name: qingclaw-macos

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Full QingClaw build version (SemVer)'
        required: true
        type: string
      deployment:
        description: 'Update deployment'
        required: true
        type: choice
        options:
          - test
          - production
        default: test
      channel:
        description: 'electron-updater channel'
        required: true
        type: choice
        options:
          - nightly
          - stable
        default: stable
      dsh_ref:
        description: 'qinglion/qingclaw-dsh branch, tag, or commit'
        required: true
        type: string
        default: codex/qingclaw-bootstrap
      test_release_id:
        description: 'Optional 32-char hex test deployment ID; generated from this run when blank'
        required: false
        type: string
      publish:
        description: 'Publish updater files and fixed website installer to d.qinglion.com'
        required: true
        type: boolean
        default: true

run-name: qingclaw-macos (${{ inputs.version }}, ${{ inputs.deployment }}, ${{ inputs.channel }})

permissions:
  contents: read

jobs:
  request:
    name: Validate release request
    runs-on: ubuntu-latest
    outputs:
      dsh_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Reject unsafe release combinations
        shell: bash
        run: |
          if [[ "${QINGCLAW_DEPLOYMENT}" == "production" && "${QINGCLAW_CHANNEL}" != "stable" ]]; then
            echo 'Production releases must use the stable updater channel' >&2
            exit 1
          fi
        env:
          QINGCLAW_DEPLOYMENT: ${{ inputs.deployment }}
          QINGCLAW_CHANNEL: ${{ inputs.channel }}

      - name: Resolve trusted QingClaw DSH commit
        uses: actions/checkout@v4
        with:
          repository: qinglion/qingclaw-dsh
          ref: ${{ inputs.dsh_ref }}
          path: qingclaw-dsh
          token: ${{ inputs.deployment == 'production' && secrets.STRONGER_GITHUB_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Validate trusted DSH source
        id: source
        working-directory: qingclaw-dsh
        shell: bash
        run: |
          trusted_ref='codex/qingclaw-bootstrap'
          git fetch --no-tags origin "refs/heads/${trusted_ref}:refs/remotes/origin/${trusted_ref}"
          if ! git merge-base --is-ancestor HEAD "origin/${trusted_ref}"; then
            echo "Selected DSH ref is not part of ${trusted_ref}; refusing to expose release credentials" >&2
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

  package:
    name: Package ${{ matrix.target }}
    needs: request
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            target: mac-arm64
          - runner: macos-15-intel
            arch: x64
            target: mac-x64
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: qingclaw-${{ inputs.deployment }}-${{ inputs.channel }}-${{ matrix.target }}
      cancel-in-progress: false
    env:
      QINGCLAW_VERSION: ${{ inputs.version }}
      QINGCLAW_DEPLOYMENT: ${{ inputs.deployment }}
      QINGCLAW_CHANNEL: ${{ inputs.channel }}
      QINGCLAW_ARCH: ${{ matrix.arch }}
      QINGCLAW_TARGET: ${{ matrix.target }}
      DSH_PACKAGING_PRESET: ${{ inputs.deployment }}
      DSH_DESKTOP_UPDATE_CHANNEL: ${{ inputs.channel }}
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_BUILDER_BINARIES_MIRROR: https://npmmirror.com/mirrors/electron-builder-binaries/
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Checkout QingClaw DSH
        uses: actions/checkout@v4
        with:
          repository: qinglion/qingclaw-dsh
          ref: ${{ needs.request.outputs.dsh_sha }}
          path: qingclaw-dsh
          token: ${{ inputs.deployment == 'production' && secrets.STRONGER_GITHUB_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.9.0'

      - name: Activate pnpm 11.28.5
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate

      - name: Resolve test release ID
        id: release
        shell: bash
        env:
          REQUESTED_RELEASE_ID: ${{ inputs.test_release_id || vars.QINGCLAW_TEST_RELEASE_ID }}
        run: |
          if [[ "${QINGCLAW_DEPLOYMENT}" == "test" ]]; then
            release_id="${REQUESTED_RELEASE_ID}"
            if [[ -z "${release_id}" ]]; then
              release_id="$(printf '%s' "${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${QINGCLAW_VERSION}" | shasum -a 256 | cut -c1-32)"
            fi
            if [[ ! "${release_id}" =~ ^[a-f0-9]{32}$ ]]; then
              echo 'test_release_id must contain 32 lowercase hexadecimal characters' >&2
              exit 1
            fi
            echo "id=${release_id}" >> "${GITHUB_OUTPUT}"
          else
            echo 'id=' >> "${GITHUB_OUTPUT}"
          fi

      - name: Prepare private packaging configuration
        env:
          QINGCLAW_CONFIG_DIR: ${{ runner.temp }}/qingclaw-packaging
          QINGCLAW_TEST_RELEASE_ID: ${{ steps.release.outputs.id }}
          QINGCLAW_MACOS_SIGNING_IDENTITY: ${{ vars.QINGCLAW_MACOS_SIGNING_IDENTITY }}
          CERTIFICATE_OSX_P12_DATA: ${{ secrets.CERTIFICATE_OSX_P12_DATA }}
          CERTIFICATE_OSX_P12_PASSWORD: ${{ secrets.CERTIFICATE_OSX_P12_PASSWORD }}
          CERTIFICATE_OSX_ID: ${{ secrets.CERTIFICATE_OSX_ID }}
          CERTIFICATE_OSX_APP_PASSWORD: ${{ secrets.CERTIFICATE_OSX_APP_PASSWORD }}
          CERTIFICATE_OSX_TEAM_ID: ${{ secrets.CERTIFICATE_OSX_TEAM_ID }}
        run: node scripts/qingclaw/write-packaging-config.mjs

      - name: Install DSH dependencies
        working-directory: qingclaw-dsh
        run: pnpm install --frozen-lockfile

      - name: Package, sign, and notarize
        working-directory: qingclaw-dsh
        env:
          DSH_PACKAGING_CONFIG_DIR: ${{ runner.temp }}/qingclaw-packaging
        run: pnpm run "package:desktop:mac:${QINGCLAW_ARCH}" -- --build-version "${QINGCLAW_VERSION}"

      - name: Upload signed package to OSS
        if: ${{ inputs.publish }}
        working-directory: qingclaw-dsh
        env:
          QINGCLAW_VERSION: ${{ inputs.version }}
          QINGCLAW_ARCH: ${{ matrix.arch }}
          QINGCLAW_TARGET: ${{ matrix.target }}
          QINGCLAW_QUALITY: ${{ inputs.deployment == 'production' && 'stable' || 'beta' }}
          QINGCLAW_CHANNEL: ${{ inputs.channel }}
          QINGCLAW_ARTIFACTS_DIR: ${{ github.workspace }}/qingclaw-dsh/apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts
          PUBLIC_DOWNLOAD_DOMAIN: d.qinglion.com
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET_NAME: ${{ secrets.OSS_BUCKET_NAME }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_REGION: ${{ vars.QINGCLAW_OSS_REGION || 'oss-cn-hangzhou' }}
          VSCODE_ARCH: ${{ matrix.arch }}
        run: bash "${GITHUB_WORKSPACE}/scripts/qingclaw/upload-desktop.sh"

      - name: Retain signed package for aggregate publication
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: qingclaw-build-${{ inputs.version }}-${{ matrix.target }}
          path: qingclaw-dsh/apps/desktop/.desktop-build/targets/${{ matrix.target }}/artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove private packaging configuration
        if: ${{ always() }}
        shell: bash
        run: |
          config_dir="${RUNNER_TEMP}/qingclaw-packaging"
          if [[ -z "${RUNNER_TEMP}" || "${config_dir}" != "${RUNNER_TEMP}/qingclaw-packaging" ]]; then
            echo 'Refusing to remove an unresolved packaging directory' >&2
            exit 1
          fi
          rm -rf -- "${config_dir}"
