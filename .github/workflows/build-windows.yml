name: yuejuan-windows

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'Build quality'
        required: true
        type: choice
        options:
          - stable
          - insider
        default: insider
      branch:
        description: 'Git branch to build'
        required: false
        type: string
        default: master

run-name: yuejuan-windows (quality=${{ inputs.quality }}, branch=${{ inputs.branch }})

env:
  APP_NAME: Yuejuan
  APP_QUALITY: ${{ inputs.quality }}
  ASSETS_REPOSITORY: https://github.com/qinglion/yuejuan-binaries
  VERSIONS_REPOSITORY: https://github.com/qinglion/yuejuan-versions

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        vscode_arch:
          - x64
          # - arm64
    runs-on: windows-2022
    env:
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
      APP_DIR: qinglion_yuejuan
      PREPACKAGED_APP_DIR: prepackaged/win-unpacked
      WINDOWS_SIGN_HOOK: scripts/esigner-windows.cjs
      ESIGNER_AUDIT_LOG: ${{ github.workspace }}/esigner-audit.jsonl
      npm_config_node_sqlite3_binary_host_mirror: https://registry.npmmirror.com/-/binary/sqlite3/
    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Setup Node.js 14 (fermium)
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Build and collect assets
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          OS_NAME: windows
          APP_BRANCH: ${{ inputs.branch }}
        run: |
          bash build.sh

      - name: Prepare application payload for signing
        shell: pwsh
        run: |
          ./scripts/windows-signing.ps1 `
            -Mode Prepare `
            -SourceRoot "$env:APP_DIR/build/win-unpacked" `
            -StagingDir signing_app_input `
            -MappingPath signing_app_mapping.json `
            -Extensions @('.exe', '.dll')

      - name: Sign application payload with SSL.com
        uses: sslcom/esigner-codesign@b7f8ff36fc0de8690fbbab8e5b4421d29802f747
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${{ github.workspace }}/signing_app_input
          output_path: ${{ github.workspace }}/signing_app_output
          override: true
          malware_block: true
          environment_name: PROD
          clean_logs: true
          jvm_max_memory: 1024M
          signing_method: v1

      - name: Restore and verify signed application payload
        shell: pwsh
        run: |
          ./scripts/windows-signing.ps1 `
            -Mode RestoreAndVerify `
            -SourceRoot "$env:APP_DIR/build/win-unpacked" `
            -SignedDir signing_app_output `
            -MappingPath signing_app_mapping.json `
            -Extensions @('.exe', '.dll')

          $prepackagedParent = Split-Path -Parent $env:PREPACKAGED_APP_DIR
          Remove-Item -LiteralPath $prepackagedParent -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $prepackagedParent -Force | Out-Null
          Copy-Item -LiteralPath "$env:APP_DIR/build/win-unpacked" `
            -Destination $prepackagedParent -Recurse -Force

          ./scripts/windows-signing.ps1 `
            -Mode VerifyTree `
            -SourceRoot $env:PREPACKAGED_APP_DIR `
            -Extensions @('.exe', '.dll')

      - name: Package signed application
        shell: bash
        env:
          APP_BRANCH: ${{ inputs.branch }}
          ES_USERNAME: ${{ secrets.ES_USERNAME }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          CREDENTIAL_ID: ${{ secrets.CREDENTIAL_ID }}
          ES_TOTP_SECRET: ${{ secrets.ES_TOTP_SECRET }}
        run: bash package_windows_prepackaged.sh

      - name: Verify signed uninstaller and installer
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:ESIGNER_AUDIT_LOG -PathType Leaf)) {
            throw "eSigner audit log is missing: $env:ESIGNER_AUDIT_LOG"
          }
          $audit = @(Get-Content -LiteralPath $env:ESIGNER_AUDIT_LOG | ForEach-Object {
            if (-not [string]::IsNullOrWhiteSpace($_)) { $_ | ConvertFrom-Json }
          })
          $uninstallers = @($audit | Where-Object {
            [System.IO.Path]::GetFileName($_.path) -like '__uninstaller-*.exe'
          })
          $installers = @($audit | Where-Object {
            [System.IO.Path]::GetFileName($_.path) -like '*Setup*.exe'
          })
          if ($uninstallers.Count -eq 0) {
            throw 'electron-builder did not sign and verify the NSIS uninstaller.'
          }
          if ($installers.Count -eq 0) {
            throw 'electron-builder did not sign and verify the NSIS installer.'
          }

          ./scripts/windows-signing.ps1 `
            -Mode VerifyTree `
            -SourceRoot assets `
            -Extensions @('.exe', '.msi')

      - name: Prepare checksums
        shell: bash
        run: bash prepare_checksums.sh

      - name: Upload to OSS
        shell: bash
        env:
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_BUCKET_NAME: ${{ secrets.OSS_BUCKET_NAME }}
          OSS_ENDPOINT: ${{ secrets.OSS_ENDPOINT }}
          OSS_REGION: ${{ secrets.OSS_REGION }}
          PUBLIC_DOWNLOAD_DOMAIN: ${{ secrets.PUBLIC_DOWNLOAD_DOMAIN }}
          VSCODE_PLATFORM: win32
        run: bash upload_to_oss.sh
        # Required step; script fails if missing creds

      - name: Update versions repo
        shell: bash
        env:
          SHOULD_BUILD: 'yes'
          GITHUB_TOKEN: ${{ secrets.STRONGER_GITHUB_TOKEN }}
          GITHUB_USERNAME: ${{ github.repository_owner }}
          PUBLIC_DOWNLOAD_DOMAIN: ${{ secrets.PUBLIC_DOWNLOAD_DOMAIN }}
          VSCODE_PLATFORM: win32
          APP_BRANCH: ${{ inputs.branch }}
        run: bash release.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: yuejuan-windows-${{ matrix.vscode_arch }}
          path: assets/
          retention-days: 7


